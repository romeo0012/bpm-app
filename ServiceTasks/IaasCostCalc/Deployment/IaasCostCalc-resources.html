  <script cam-script type="text/form-script">
	// form gets the initial state of the radio button from an existing process variable
    var variableManager = camForm.variableManager;
    camForm.on('form-loaded', function() {
        variableManager.fetchVariable('sla');
        variableManager.fetchVariable('continuity');
    });
    camForm.on('variables-fetched', function() {
        // value has been fetched, bind to control
        $('input:radio[name=sla]').val([variableManager.variable('sla').value]);
        $('input:radio[name=continuity]').val([variableManager.variable('continuity').value]);
    });
    camForm.on('submit', function(evt) {
        // set value in variable manager so that it can be sent to backend
        variableManager.variableValue('sla', $('input:radio[name=sla]:checked').val());
        variableManager.variableValue('continuity', $('input:radio[name=continuity]:checked').val());
    });
  </script>
