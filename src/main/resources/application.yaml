spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
            user-name-attribute: preferred_username

      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

  resources:
    static-locations: classpath:/webapp/

  mvc:
    log-request-details: true

server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /
  forward-headers-strategy: native

camunda:
  bpm:
    filter:
      create: All Tasks
    webapp:
      security:
        enabled: false
    history-level: full

plugin:
  identity:
    keycloak:
      keycloakIssuerUrl: ${KEYCLOAK_ISSUER_URI}
      keycloakAdminUrl: ${KEYCLOAK_ADMIN_URL}
      clientId: ${CAMUNDA_IDENTITY_CLIENT_ID}
      clientSecret: ${CAMUNDA_IDENTITY_CLIENT_SECRET}
      useEmailAsCamundaUserId: false
      useUsernameAsCamundaUserId: true
      useGroupPathAsCamundaGroupId: true
      administratorGroupName: ${CAMUNDA_ADMIN_GROUP:camunda-admin}
      disableSSLCertificateValidation: false
      useFormBasedAuthentication: false

logging:
  enableLoggingRequestDetails: true
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.authentication: DEBUG
    org.springframework.security.oauth2.client: DEBUG
    org.springframework.security.oauth2.client.web: DEBUG
    org.springframework.security.oauth2.client.endpoint: DEBUG
    org.camunda.bpm.engine: DEBUG
    org.camunda.bpm.webapp: DEBUG
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: TRACE
    org.springframework.web.servlet.DispatcherServlet: TRACE
    org.springframework.web: TRACE

management:
  endpoints:
    web:
      base-path: /
  endpoint:
    health:
      enabled: true
      show-details: never